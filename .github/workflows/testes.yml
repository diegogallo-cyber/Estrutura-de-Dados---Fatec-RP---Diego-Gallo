name: Testes C11

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compilar-e-testar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Compilar o programa
        run: gcc -std=c11 -Wall -Wextra -pedantic -Iinclude src/main.c src/bst.c src/fila.c src/entrada.c -o locais
      - name: Compilar e executar testes das estruturas
        run: |
          gcc -std=c11 -Wall -Wextra -pedantic -Iinclude tests/test_estruturas.c src/bst.c src/fila.c -o teste_estruturas
          ./teste_estruturas
      - name: Conferir listagem em ordem pelo menu
        run: |
          output=$(printf '%s\n' 1 40 Praca_Central Cultura Centro 1 20 Parque_Norte Lazer Sul 1 60 Museu_Central Historia Centro 4 8 | ./locais)
          ids=$(printf '%s\n' "$output" | sed -n 's/.*ID: \([0-9][0-9]*\) |.*/\1/p' | tr '\n' ' ' | sed 's/ $//')
          echo "IDs listados: $ids"
          test "$ids" = "20 40 60"
      - name: Validar entrada inválida e fila vazia
        run: |
          long_text=$(printf '%080d' 0 | tr '0' 'x')
          invalid_id_output=$(printf '%s\n' 1 abc 8 | ./locais)
          printf '%s\n' "$invalid_id_output" | grep -q 'ID inválido'
          long_text_output=$(printf '%s\n' 1 5 "$long_text" 8 | ./locais)
          printf '%s\n' "$long_text_output" | grep -q 'Texto muito longo'
          queue_output=$(printf '%s\n' 5 999 6 6 7 8 | ./locais)
          printf '%s\n' "$queue_output" | grep -q 'ID 999 removido'
          printf '%s\n' "$queue_output" | grep -q 'Fila vazia'
          echo "Validacao de ID, tamanho de texto e fila vazia passou."
